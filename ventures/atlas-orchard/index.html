<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Atlas Orchard: merge, grow and compound</title>
<meta name="description" content="Atlas Orchard: a cozy but active merge-and-grow strategy game. Plant company seeds, merge them into compounding fruit trees and weather market storms, droughts and booms.">
<meta name="theme-color" content="#7fbf4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game" aria-label="Orchard board"></canvas>

<header id="hud">
  <div class="hud-row">
    <div class="pill coins" id="coinPill" title="Dividends (coins)">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="10" fill="#f6c343" stroke="#c98f16" stroke-width="2"/><path d="M12 6v12M9 9h4.5a2 2 0 010 4h-3a2 2 0 000 4H15" fill="none" stroke="#9a6a0c" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span id="coins">0</span>
    </div>
    <div class="season-box">
      <div id="seasonLabel">Season 1 · Spring</div>
      <div class="timebar"><div id="timeFill"></div></div>
    </div>
    <div class="pill acorns" id="acornPill" title="Acorns: spend on permanent upgrades">
      <svg viewBox="0 0 24 24" class="ico"><path d="M5 10c0-3 3-5 7-5s7 2 7 5z" fill="#8a5a36" stroke="#5e3b22" stroke-width="1.5"/><path d="M6 10h12c0 6-3 10-6 11-3-1-6-5-6-11z" fill="#d99a4e" stroke="#9c6428" stroke-width="1.5"/><path d="M12 5V2" stroke="#5e3b22" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="acorns">0</span>
    </div>
    <button class="icon-btn" id="btnSound" aria-label="Toggle sound" title="Sound (M)">
      <svg viewBox="0 0 24 24" class="ico snd-on"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 24 24" class="ico snd-off"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="btnMenu" aria-label="Menu" title="Menu (Esc)">
      <svg viewBox="0 0 24 24" class="ico"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="harvest-row">
    <div class="harvest-bar" id="harvestBar">
      <div id="harvestFill"></div>
      <span class="star-mark" id="sm1">&#9733;</span><span class="star-mark" id="sm2">&#9733;</span><span class="star-mark" id="sm3">&#9733;</span>
    </div>
    <div id="harvestText">Harvest 0</div>
  </div>
</header>

<div id="banner" class="banner hidden" role="status" aria-live="polite">
  <div class="banner-icon" id="bannerIcon"></div>
  <div class="banner-text"><div class="banner-title" id="bannerTitle"></div><div class="banner-sub" id="bannerSub"></div></div>
  <div class="banner-count" id="bannerCount"></div>
</div>

<footer id="bar">
  <button id="btnPlant" class="big-btn" title="Plant the next seed (Space / P)">
    <canvas id="seedPreview" width="96" height="96"></canvas>
    <span class="big-label"><b>Plant</b><small><svg viewBox="0 0 24 24" class="ico tiny"><circle cx="12" cy="12" r="10" fill="#f6c343" stroke="#c98f16" stroke-width="2"/></svg><span id="plantCost">5</span></small></span>
  </button>
  <div id="stakePill" class="pill stake" title="Storm stakes: tap trees during a storm warning to protect them">
    <svg viewBox="0 0 24 24" class="ico"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="#7fb8f0" stroke="#3f78b5" stroke-width="1.6"/><path d="M12 6v11" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    <span id="stakes">2</span>
  </div>
  <div id="sellBin" class="sell" title="Drag a tree here to sell it">
    <svg viewBox="0 0 24 24" class="ico"><path d="M3 9h18l-2 11H5z" fill="#c98b4e" stroke="#7a4f24" stroke-width="1.6"/><path d="M3 9l3-5h12l3 5" fill="#e8b27a" stroke="#7a4f24" stroke-width="1.6"/><path d="M8 13h8M8 16h8" stroke="#7a4f24" stroke-width="1.4"/></svg>
    <span>Sell</span>
  </div>
  <button id="btnUpg" class="tool-btn" title="Upgrades (U)">
    <svg viewBox="0 0 24 24" class="ico"><path d="M12 3l3 6 6 .5-4.5 4 1.5 6.5L12 16.5 6 20l1.5-6.5L3 9.5 9 9z" fill="#f6c343" stroke="#b07d12" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <span>Upgrades</span><i class="dot hidden" id="upgDot"></i>
  </button>
  <button id="btnGoals" class="tool-btn" title="Achievements & records (G)">
    <svg viewBox="0 0 24 24" class="ico"><path d="M7 3h10v5a5 5 0 01-10 0z" fill="#f6c343" stroke="#b07d12" stroke-width="1.5"/><path d="M7 5H4c0 3 1.5 4.5 3 5M17 5h3c0 3-1.5 4.5-3 5M12 13v4M8 21h8l-1-4H9z" fill="none" stroke="#b07d12" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <span>Goals</span>
  </button>
  <button id="btnDaily" class="tool-btn" title="Daily seeded challenge (D)">
    <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="5" width="18" height="16" rx="3" fill="#fff" stroke="#6b8f3a" stroke-width="1.6"/><path d="M3 10h18" stroke="#6b8f3a" stroke-width="1.6"/><path d="M8 3v4M16 3v4" stroke="#6b8f3a" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="15.5" r="2.6" fill="#e5433b"/></svg>
    <span>Daily</span>
  </button>
</footer>

<div id="toasts" aria-live="polite"></div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="card">
    <button class="close" id="modalClose" aria-label="Close">&times;</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<div id="tut" class="tut hidden">
  <div class="tut-card"><div id="tutText"></div><div class="tut-actions"><button id="tutGo" class="btn primary hidden">Start Season 1</button><button id="tutSkip" class="btn ghost">Skip tutorial</button></div></div>
</div>

<div id="pause" class="pause hidden"><div class="pause-card"><b>Paused</b><span>Tap anywhere to keep growing</span></div></div>

<noscript><p style="padding:2em;text-align:center">Atlas Orchard needs JavaScript to run.</p></noscript>
<script src="js/audio.js" defer></script>
<script src="js/game.js" defer></script>
<script src="../../shared/playtime.js?v=2" data-game="atlas-orchard" defer></script>
</body>
</html>
